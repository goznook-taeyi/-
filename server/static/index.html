<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숏폼 솔팅기</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f9f9f9; --card: #fff; --text: #0f0f0f; --sub: #606060;
    --line: #e5e5e5; --accent: #065fd4; --danger: #cc0000; --ok: #1a7f37;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f0f0f; --card: #212121; --text: #f1f1f1; --sub: #aaa; --line: #3f3f3f; --accent: #3ea6ff; --ok: #46d369; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Roboto", "Noto Sans KR", sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--sub); font-size: 13px; margin-bottom: 20px; }
  textarea {
    width: 100%; min-height: 72px; padding: 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--card); color: var(--text); font-size: 14px; resize: vertical;
  }
  .row-btns { display: flex; gap: 8px; margin: 8px 0 24px; flex-wrap: wrap; }
  button {
    border: none; border-radius: 18px; padding: 8px 16px; font-size: 14px;
    cursor: pointer; background: var(--card); color: var(--text); border: 1px solid var(--line);
  }
  button:hover { filter: brightness(0.95); }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  button:disabled { opacity: 0.6; cursor: default; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tabs button.active { background: var(--text); color: var(--bg); border-color: transparent; }
  .item {
    display: flex; align-items: center; gap: 12px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px;
  }
  .item img { width: 96px; height: 54px; object-fit: cover; border-radius: 8px; background: #000; flex: none; }
  .info { flex: 1; min-width: 0; }
  .info a { color: var(--text); text-decoration: none; font-size: 14px; word-break: break-all; }
  .info a:hover { text-decoration: underline; }
  .badge { display: inline-block; font-size: 11px; color: var(--ok); border: 1px solid var(--ok); border-radius: 10px; padding: 1px 8px; margin-top: 4px; }
  .actions { display: flex; gap: 6px; flex: none; align-items: center; }
  .actions .pick.on { background: var(--ok); color: #fff; border-color: transparent; }
  .actions .dl { background: var(--accent); color: #fff; border-color: transparent; min-width: 96px; }
  .actions .dl.err { background: var(--danger); }
  .actions .dl.done { background: var(--ok); }
  .actions .del { padding: 8px 10px; }
  .empty { color: var(--sub); text-align: center; padding: 40px 0; }
  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
    background: #212121; color: #fff; padding: 12px 20px; border-radius: 8px;
    font-size: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.3); z-index: 10; max-width: 80vw;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>숏폼 솔팅기</h1>
  <div class="sub">유튜브 숏츠 URL을 모아서 골라내고, 골라낸 영상은 우측 ⬇ 버튼으로 바로 다운로드하세요. (저장 위치: 내 PC의 Downloads/YouTube)</div>

  <textarea id="input" placeholder="유튜브 URL을 붙여넣으세요 (여러 개면 줄바꿈으로 구분)&#10;예: https://www.youtube.com/shorts/xxxxxxx"></textarea>
  <div class="row-btns">
    <button class="primary" id="add">목록에 추가</button>
    <button id="dl-picked">⬇ 골라낸 영상 모두 다운로드</button>
  </div>

  <div class="tabs">
    <button id="tab-all" class="active">전체</button>
    <button id="tab-picked">골라낸 것만</button>
  </div>
  <div id="list"></div>
</div>

<script>
const API = "";   // 같은 서버(127.0.0.1:8756)에서 서빙되므로 상대 경로면 충분
let videos = JSON.parse(localStorage.getItem("sorter.videos") || "[]");
let tab = "all";

function save() { localStorage.setItem("sorter.videos", JSON.stringify(videos)); }

function videoId(url) {
  try {
    const u = new URL(url);
    if (u.hostname === "youtu.be") return u.pathname.slice(1).split("/")[0];
    const m = u.pathname.match(/^\/(shorts|embed)\/([^/?]+)/);
    if (m) return m[2];
    return u.searchParams.get("v") || "";
  } catch { return ""; }
}

function toast(msg) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

async function download(url, btn) {
  btn.disabled = true; btn.classList.remove("err", "done");
  try {
    const res = await fetch(`${API}/download`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url }),
    }).catch(() => { throw new Error("다운로드 서버를 먼저 실행하세요 (python server/app.py)"); });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "다운로드 요청 실패");
    for (;;) {
      await new Promise(r => setTimeout(r, 1000));
      const job = await (await fetch(`${API}/status/${data.job_id}`)).json();
      if (job.status === "done") { btn.textContent = "✅ 완료"; btn.classList.add("done"); return; }
      if (job.status === "error") throw new Error(job.error || "다운로드 실패");
      btn.textContent = `${Math.floor(job.progress || 0)}%`;
    }
  } catch (e) {
    btn.textContent = "다시 시도";
    btn.classList.add("err");
    btn.disabled = false;
    toast(e.message);
  }
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  const shown = videos.filter(v => tab === "all" || v.picked);
  if (!shown.length) {
    list.innerHTML = `<div class="empty">${tab === "all" ? "아직 영상이 없습니다. 위에 URL을 붙여넣어 추가하세요." : "골라낸 영상이 없습니다."}</div>`;
    return;
  }
  for (const v of shown) {
    const item = document.createElement("div");
    item.className = "item";

    const img = document.createElement("img");
    const id = videoId(v.url);
    if (id) img.src = `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
    img.alt = "";

    const info = document.createElement("div");
    info.className = "info";
    const a = document.createElement("a");
    a.href = v.url; a.target = "_blank"; a.rel = "noopener";
    a.textContent = v.url;
    info.appendChild(a);
    if (v.picked) {
      const b = document.createElement("span");
      b.className = "badge"; b.textContent = "골라냄";
      info.appendChild(document.createElement("br"));
      info.appendChild(b);
    }

    const actions = document.createElement("div");
    actions.className = "actions";

    const pick = document.createElement("button");
    pick.className = "pick" + (v.picked ? " on" : "");
    pick.textContent = v.picked ? "👍 골라냄" : "골라내기";
    pick.onclick = () => { v.picked = !v.picked; save(); render(); };

    const dl = document.createElement("button");
    dl.className = "dl";
    dl.textContent = "⬇ 다운로드";
    dl.onclick = () => download(v.url, dl);

    const del = document.createElement("button");
    del.className = "del"; del.title = "목록에서 제거"; del.textContent = "✕";
    del.onclick = () => { videos = videos.filter(x => x !== v); save(); render(); };

    actions.append(pick, dl, del);
    item.append(img, info, actions);
    list.appendChild(item);
  }
}

document.getElementById("add").onclick = () => {
  const box = document.getElementById("input");
  const urls = box.value.split(/\s+/).map(s => s.trim()).filter(Boolean);
  let added = 0;
  for (const url of urls) {
    if (!/^https?:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//.test(url)) continue;
    if (videos.some(v => v.url === url)) continue;
    videos.push({ url, picked: false });
    added++;
  }
  if (!added) { toast("추가할 유튜브 URL이 없습니다."); return; }
  box.value = "";
  save(); render();
};

document.getElementById("dl-picked").onclick = async (e) => {
  const urls = videos.filter(v => v.picked).map(v => v.url);
  if (!urls.length) { toast("골라낸 영상이 없습니다. 먼저 '골라내기'를 눌러 선택하세요."); return; }
  const btn = e.target; btn.disabled = true;
  try {
    const res = await fetch(`${API}/download/batch`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ urls }),
    }).catch(() => { throw new Error("다운로드 서버를 먼저 실행하세요 (python server/app.py)"); });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "요청 실패");
    toast(`${data.jobs.filter(j => j.job_id).length}개 다운로드 시작 — Downloads/YouTube 폴더를 확인하세요.`);
  } catch (err) {
    toast(err.message);
  } finally {
    btn.disabled = false;
  }
};

document.getElementById("tab-all").onclick = (e) => {
  tab = "all";
  e.target.classList.add("active");
  document.getElementById("tab-picked").classList.remove("active");
  render();
};
document.getElementById("tab-picked").onclick = (e) => {
  tab = "picked";
  e.target.classList.add("active");
  document.getElementById("tab-all").classList.remove("active");
  render();
};

render();
</script>
</body>
</html>
